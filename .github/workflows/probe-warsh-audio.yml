name: Probe Warsh audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p /tmp/wa && cd /tmp/wa && : > res.txt
          for d in warsh_ibrahim_aldosary_128kbps warsh_yassin_al_jazaery_64kbps warsh_Abdul_Basit_128kbps; do
            for base in "https://everyayah.com/data/warsh/$d" "http://mirrors.quranicaudio.com/everyayah/warsh/$d"; do
              for f in 001001 001007 001008 002285 002286 002287 018105 018110 018111 112004 112005 114006 114007; do
                echo "$base/$f.mp3 $(curl -s -m 40 -I -o /dev/null -w '%{http_code} %header{content-length}' $base/$f.mp3)" >> res.txt
              done
            done
          done
          cat res.txt
      - name: Push report
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/warshaudio2; git rm -rf . -q
          mkdir wa; cp /tmp/wa/res.txt wa/; git add wa; git commit -q -m probe; git push -f origin data/warshaudio2
