name: Deploy AI Shar'i worker

# Deploys worker/ai-shari to Cloudflare (free plan). Needs these in GitHub -> Settings -> Secrets and variables -> Actions:
#   secrets:  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GEMINI_API_KEY
# After the first deploy, copy the printed URL into a repository VARIABLE named AI_WORKER_URL and re-run "pages".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/ai-shari/**', '.github/workflows/ai-worker.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ] || [ -z "$G" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / GEMINI_API_KEY - skipping deploy."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == 'yes'
        with:
          node-version: 20

      - name: Create KV namespace (rate limits) if needed
        if: steps.chk.outputs.go == 'yes'
        working-directory: worker/ai-shari
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 kv namespace list > /tmp/kv.json
          ID=$(python3 -c "import json;d=json.load(open('/tmp/kv.json'));print(next((x['id'] for x in d if x['title']=='qurani-ai-shari-RL'),''))")
          if [ -z "$ID" ]; then
            npx --yes wrangler@3 kv namespace create RL
            npx --yes wrangler@3 kv namespace list > /tmp/kv.json
            ID=$(python3 -c "import json;d=json.load(open('/tmp/kv.json'));print(next((x['id'] for x in d if x['title'].endswith('RL')),''))")
          fi
          echo "KV id: $ID"
          sed -i "s/REPLACE_WITH_KV_ID/$ID/" wrangler.toml

      - name: Deploy
        if: steps.chk.outputs.go == 'yes'
        working-directory: worker/ai-shari
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@3 secret put GEMINI_API_KEY
          echo "Worker URL is shown above (https://qurani-ai-shari.<your-subdomain>.workers.dev)"
