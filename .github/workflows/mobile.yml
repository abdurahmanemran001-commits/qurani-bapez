name: Build mobile apps (Android + iOS)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Assemble web (no big page images)
        run: |
          set -o pipefail
          bash tools/assemble_web.sh /tmp/w --app 2>&1 | tee /tmp/log.txt
          bash tools/bundle_app_web.sh /tmp/w mobile/www
      - name: Capacitor project
        working-directory: mobile
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && node make-icon.mjs && npx cap add android \
            && npx capacitor-assets generate --android --assetPath assets && npx cap sync android) 2>&1 | tee -a /tmp/log.txt
      - name: Android notification permission
        run: |
          M=mobile/android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$P" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$M"
          done
          grep -n "uses-permission" "$M"
      - name: Build APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -80 | tee -a /tmp/log.txt
          ls -l app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/qurani-bapez-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: qurani-bapez-android.apk
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "App builds" --notes "Latest Android / iOS builds" --prerelease
          gh release upload app-latest qurani-bapez-android.apk --clobber
      - name: Push log on failure
        if: failure()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/lg && cp /tmp/log.txt /tmp/lg/android.log 2>/dev/null || echo none > /tmp/lg/android.log
          git checkout --orphan data/buildlog-android; git rm -rf . -q
          cp /tmp/lg/android.log .; git add android.log; git commit -q -m log; git push -f origin data/buildlog-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble web (no big page images)
        run: |
          set -o pipefail
          bash tools/assemble_web.sh /tmp/w --app 2>&1 | tee /tmp/log.txt
          mkdir -p mobile/www && cp -r /tmp/w/mushaf/. mobile/www/
      - name: Capacitor project
        working-directory: mobile
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && node make-icon.mjs && npx cap add ios \
            && npx capacitor-assets generate --ios --assetPath assets && npx cap sync ios) 2>&1 | tee -a /tmp/log.txt
      - name: Build for iOS simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          ls
          WS=App.xcworkspace; [ -d "$WS" ] && ARG="-workspace $WS" || ARG="-project App.xcodeproj"
          xcodebuild $ARG -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60 | tee -a /tmp/log.txt
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/qurani-bapez-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: qurani-bapez-ios-simulator.zip
      - name: Push log on failure
        if: failure()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/lg && cp /tmp/log.txt /tmp/lg/ios.log 2>/dev/null || echo none > /tmp/lg/ios.log
          git checkout --orphan data/buildlog-ios; git rm -rf . -q
          cp /tmp/lg/ios.log .; git add ios.log; git commit -q -m log; git push -f origin data/buildlog-ios
