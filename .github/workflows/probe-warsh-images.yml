name: Probe Warsh images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p /tmp/wi && cd /tmp/wi && : > res.txt
          B=http://android.quran.com/data
          for w in _1024 _1280 _1260 _800 _1920 _1440 ""; do
            for u in "$B/warsh/zips/images$w.zip" "$B/warsh/databases/ayahinfo/ayahinfo$w.zip" "$B/warsh/databases/ayahinfo/ayahinfo$w.db" "$B/warsh/width$w/page001.png"; do
              echo "$u $(curl -s -m 40 -I -o /dev/null -w '%{http_code} %header{content-length}' $u)" >> res.txt
            done
          done
          for u in "$B/warsh/" "$B/databases/audio/" "$B/warsh/databases/audio/"; do
            echo "$u $(curl -s -m 30 -I -o /dev/null -w '%{http_code}' $u)" >> res.txt
          done
          cat res.txt
      - name: Push report
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/warshimg; git rm -rf . -q
          mkdir wi; cp /tmp/wi/res.txt wi/; git add wi; git commit -q -m probe; git push -f origin data/warshimg
