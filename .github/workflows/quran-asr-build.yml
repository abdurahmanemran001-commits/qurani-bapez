name: Build Quran ASR model (manual)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash tools/build_quran_asr.sh out/quran-asr
      - uses: actions/upload-artifact@v4
        with:
          name: quran-asr
          path: out/quran-asr
