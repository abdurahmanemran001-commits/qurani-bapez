name: Probe nquran

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p /tmp/o && cd /tmp/o
          python3 - <<'PY' > /tmp/o/report.txt 2>&1 || true
          import subprocess,re
          B='https://www.nquran.com/ar/quranplayer/ajax/nindex.php'
          def get(q):
              return subprocess.run(['curl','-sL','-m','60','-A','Mozilla/5.0','-e','https://www.nquran.com/ar/quranplayer/','-G',B,'--data-raw',q],capture_output=True,text=True).stdout
          for q in ['rewayano=13&sorano=18&sorafrom=18&sorato=18&ayafrom=0&ayato=0&page=qplayer',
                    'rewayano=13&sorano=18&sorafrom=18&sorato=18&ayafrom=0&ayato=0&qareeid=0',
                    'rewayano=13&sorano=18&currentsora=18&currentaya=1&currentpage=0&page=qplayer',
                    'rewayano=13&sorano=18&sorafrom=18&sorato=19&ayafrom=0&ayato=0&page=qplayer&action=getplaylist']:
              h=get(q); m=re.search(r'id="playlist"[^>]*>\s*(.*?)\s*</div>',h,re.S)
              print(q,len(h),'|',(m.group(1)[:600] if m else None))
          PY
          cat report.txt | cut -c1-900
      - name: Push
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/probe2; git rm -rf . -q
          cp -r /tmp/o probe2; git add probe2; git commit -q -m probe; git push -f origin data/probe2
