name: Convert zikr audio

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding the original
        default: zikr-ewaran
      asset:
        description: Original asset name
        default: default.mp3
      out:
        description: Output name uploaded to release zikr-audio
        default: evening.mp3

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Download original, convert to small mp3, upload to release zikr-audio
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
          OUT: ${{ inputs.out }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -O original.bin
          ffprobe -hide_banner original.bin 2>&1 | grep -E "Duration|Stream" || true
          ffmpeg -loglevel error -y -i original.bin -vn -ac 1 -ar 32000 -b:a 56k "$OUT"
          ls -la "$OUT"
          gh release upload zikr-audio "$OUT" -R "$GITHUB_REPOSITORY" --clobber
