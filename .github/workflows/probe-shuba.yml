name: Probe Shuba

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb
          curl -sL -m 60 -A "qurani-bapez (abdurahmanemran001@gmail.com)" "https://api.quranpedia.net/v1/mushafs" -o mushafs.json
          curl -sL -m 60 -A "qurani-bapez (abdurahmanemran001@gmail.com)" "https://api.quranpedia.net/v1/reciters" -o reciters.json
          python3 - <<'PY'
          import json
          m=json.load(open('mushafs.json'))
          for x in m: print(json.dumps({k:v for k,v in x.items() if k!='description'},ensure_ascii=False))
          r=json.load(open('reciters.json'))
          print(type(r), len(r))
          txt=json.dumps(r,ensure_ascii=False)
          import re
          out=[]
          def walk(o):
              if isinstance(o,dict):
                  if any(isinstance(v,str) and 'شعبة' in v for v in o.values()): out.append({k:(v if not isinstance(v,list) else '[list %d]'%len(v)) for k,v in o.items()})
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(r); print(len(out)); print(json.dumps(out[:12],ensure_ascii=False,indent=1))
          json.dump(out,open('shuba_reciters2.json','w'),ensure_ascii=False,indent=1)
          PY
      - name: Push report
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/shuba2; git rm -rf . -q
          mkdir sb; cp /tmp/sb/mushafs.json /tmp/sb/shuba_reciters2.json sb/; git add sb; git commit -q -m probe; git push -f origin data/shuba2
