name: Fetch Qunbul data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build
        run: |
          mkdir -p /tmp/o && cd /tmp
          A="qurani-bapez (abdurahmanemran001@gmail.com)"
          curl -sL -m 120 -A "$A" https://api.quranpedia.net/v1/mushafs/8 -o m8.json
          curl -sL -m 120 -A "$A" -o /tmp/o/qunbul.otf https://quranpedia.net/assets/fonts/arabic/UthmanicQumbul1Ver05.otf
          ls -l m8.json /tmp/o/qunbul.otf
          python3 "$GITHUB_WORKSPACE/tools/build_qunbul.py" m8.json /tmp/o
          du -sh /tmp/o
      - name: Push data
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/qunbuldata; git rm -rf . -q
          cp -r /tmp/o qunbul; git add qunbul; git commit -q -m "qunbul data"; git push -f origin data/qunbuldata
