name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Web mushaf (qira'at library). Only the light core goes into the APK; big packs are downloaded on demand.
      - name: Bundle web mushaf into the app
        run: |
          tools/assemble_web.sh /tmp/w --app
          mkdir -p app/src/main/assets/mushaf
          cp -r /tmp/w/mushaf/. app/src/main/assets/mushaf/
          rm -rf app/src/main/assets/mushaf/data/qcf4 app/src/main/assets/mushaf/data/tajweed
          du -sh app/src/main/assets/mushaf

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 26
        run: |
          sdkmanager "platforms;android-26" "build-tools;26.0.2"
          yes | sdkmanager --licenses || true

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      # Build after replacing the retired Fabric/Crashlytics dependency with local no-op shims.
      - name: Build Madani debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleMadaniDebug --no-daemon --stacktrace 2>&1 | tee /tmp/g.log

      - name: Check APK content and publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/madani/debug/*.apk | head -1)
          cp "$APK" /tmp/qurani-bapez.apk
          { echo "size: $(du -h /tmp/qurani-bapez.apk | cut -f1)"; unzip -l /tmp/qurani-bapez.apk | grep -E "assets/mushaf/(index|view|riwayat)\.html|assets/mushaf/data/(qunbul/meta|susi/meta|warshimg/ayah/001)|ic_mushaf_library" ; echo "mushaf files: $(unzip -l /tmp/qurani-bapez.apk | grep -c 'assets/mushaf/')"; } > /tmp/apkcheck.txt
          cat /tmp/apkcheck.txt
          gh release view app-main >/dev/null 2>&1 || gh release create app-main --title "Qurani Bapez (main app) - latest debug APK" --notes "Latest build of the main Android app (with the Mushaf & Qira'at library button)." --prerelease
          gh release upload app-main /tmp/qurani-bapez.apk --clobber
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/apkcheck; git rm -rf . -q; cp /tmp/apkcheck.txt apkcheck.txt; git add apkcheck.txt; git commit -q -m check; git push -f origin data/apkcheck

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qurani-bapez-debug-apk
          path: app/build/outputs/apk/madani/debug/*.apk
          if-no-files-found: error

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          grep -nE "error:|FAILED|What went wrong" -A3 /tmp/g.log | head -80 > /tmp/err.txt || true
          tail -60 /tmp/g.log >> /tmp/err.txt
          git checkout --orphan data/buildlog-java; git rm -rf . -q
          cp /tmp/err.txt build-error.txt; git add build-error.txt; git commit -q -m log; git push -f origin data/buildlog-java

# retry after Crashlytics compatibility fix
