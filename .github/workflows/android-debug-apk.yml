name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 26
        run: |
          sdkmanager "platforms;android-26" "build-tools;26.0.2"
          yes | sdkmanager --licenses || true

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Madani debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleMadaniDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qurani-bapez-debug-apk
          path: app/build/outputs/apk/madani/debug/*.apk
          if-no-files-found: error
