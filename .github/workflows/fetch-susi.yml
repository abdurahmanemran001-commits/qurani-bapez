name: Fetch Susi data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build
        run: |
          mkdir -p /tmp/o && cd /tmp
          A="qurani-bapez (abdurahmanemran001@gmail.com)"
          curl -sL -m 120 -A "$A" https://api.quranpedia.net/v1/mushafs -o list.json
          curl -sL -m 120 -A "$A" https://api.quranpedia.net/v1/mushafs/10 -o m10.json
          curl -sL -m 120 -A "$A" https://api.quranpedia.net/v1/reciters -o qp.json
          python3 - <<'PY'
          import json,re,subprocess
          l=json.load(open('/tmp/list.json'))
          m=json.load(open('/tmp/m10.json'))
          info=[x for x in (l if isinstance(l,list) else l.get('data',l.get('mushafs',[]))) if isinstance(x,dict) and x.get('id')==10]
          print(json.dumps(info,ensure_ascii=False)[:800])
          fonts=set(re.findall(r'[A-Za-z0-9_]*(?:Souss?i|Susi)[A-Za-z0-9_]*\.(?:otf|ttf)',json.dumps(l)+json.dumps({k:v for k,v in m.items() if k!='surahs'})))
          print('fonts',fonts)
          got=None
          for f in list(fonts)+['UthmanicSousi_V20.ttf','UthmanicSousi.otf','UthmanicSusi.otf','UthmanicSoussi.otf']:
              r=subprocess.run(['curl','-sL','-m','120','-o','/tmp/o/susi.'+f.split('.')[-1],'-w','%{http_code} %{size_download}','https://quranpedia.net/assets/fonts/arabic/'+f],capture_output=True,text=True).stdout
              print(f,r)
              if r.startswith('200') and int(r.split()[1])>50000: got=f;break
          hits=[]
          def walk(o):
              if isinstance(o,dict):
                  r=o.get('rawi')
                  if isinstance(r,dict) and r.get('name')=='السوسي': hits.append({k:o[k] for k in o if k in ('id','name','server','classification')})
                  else:
                      for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(json.load(open('/tmp/qp.json')))
          json.dump({'font':got,'info':info,'quranpedia':hits},open('/tmp/o/meta2.json','w'),ensure_ascii=False)
          PY
          python3 "$GITHUB_WORKSPACE/tools/build_qunbul.py" m10.json /tmp/o
          ls /tmp/o | head
      - name: Push data
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data/susidata; git rm -rf . -q
          cp -r /tmp/o susi; git add susi; git commit -q -m "susi"; git push -f origin data/susidata
