name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web preview
        run: |
          mkdir -p dist
          cp index.html icon.svg manifest.webmanifest sw.js dist/
          tools/assemble_web.sh dist

      - name: Verify web data
        run: |
          D=dist/mushaf/data; miss=0
          for f in warshimg/pages/001.webp warshimg/ayah/001.json shubaimg/pages/604.webp shubaimg/ayah/604.json shubatiming/timing.json qaloonimg/pages/001.webp qaloonimg/ayah/001.json qaloontiming/t208.json qunbul/meta.json qunbul/pages/604.json qunbul/qunbul.otf bazzi/meta.json bazzi/pages/604.json bazzi/bazzi.otf douri/meta.json douri/pages/604.json douri/douri.ttf susi/meta.json susi/pages/604.json susi/susi.ttf khalaf/ayah/001.json khalaf/ayah/604.json qcf4/qcf.js tajweed/noorehira.ttf; do
            [ -s "$D/$f" ] || { echo "MISSING $f"; miss=1; }
          done
          [ $miss = 0 ] || exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
