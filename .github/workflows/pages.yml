name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web preview
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          mkdir -p dist/mushaf/data
          cp web/mushaf/* dist/mushaf/
          A=app/src/main/assets
          cp -r $A/qcf4 dist/mushaf/data/qcf4
          cp -r $A/warsh dist/mushaf/data/warsh
          cp -r $A/tajweed dist/mushaf/data/tajweed
          rm -f dist/mushaf/data/tajweed/tajweedquran.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
