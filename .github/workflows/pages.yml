name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore index.html if corrupted
        run: |
          if [ ! -s index.html ] || [ "$(wc -c < index.html)" -lt 10000 ]; then
            curl -fsSL -o index.html "https://raw.githubusercontent.com/abdurahmanemran001-commits/qurani-bapez/2434124b18c3d94b10146a9c9956723fb1adb06b/index.html"
          fi
          wc -c index.html

      - name: Prepare web preview
        run: |
          mkdir -p dist
          cp index.html language.js language-ui.js madani-ayah.js zikr-enhance.js zikr-streak.js tasbih.js ruqyah.js ruqyah-reciters.js ruqyah-youtube.js salah.js salah-settings.js salah-places.json salah-places-data.js icon.svg manifest.webmanifest sw.js dist/ 2>/dev/null || true
          for f in index.html language-ui.js madani-ayah.js salah.js; do
            test -f dist/$f || cp $f dist/
          done
          test -f ruqyah-reciters.js && cp ruqyah-reciters.js dist/
          test -f ruqyah-youtube.js && cp ruqyah-youtube.js dist/
          test -f salah-places.json && cp salah-places.json dist/
          test -f salah-places-data.js && cp salah-places-data.js dist/
          test -f salah-settings.js && cp salah-settings.js dist/
          if [ -d madani-timing ]; then cp -r madani-timing dist/; fi
          bash tools/assemble_web.sh dist

      - name: Build Madinah ayah bounds
        run: |
          set -e
          mkdir -p dist/madani-bounds /tmp/ai
          curl -fsSL -o /tmp/ai/ayahinfo_1260.zip "https://android.quran.com/data/databases/ayahinfo/ayahinfo_1260.zip"
          unzip -o /tmp/ai/ayahinfo_1260.zip -d /tmp/ai
          python3 - <<'PY'
          import sqlite3, json, os
          conn = sqlite3.connect('/tmp/ai/ayahinfo_1260.db')
          out = 'dist/madani-bounds'
          os.makedirs(out, exist_ok=True)
          cur = conn.execute('SELECT page_number,line_number,sura_number,ayah_number,min_x,max_x,min_y,max_y FROM glyphs ORDER BY page_number,sura_number,ayah_number,line_number,min_x')
          pages = {}
          for page, line, sura, ayah, minx, maxx, miny, maxy in cur:
              key = '%d:%d' % (sura, ayah)
              bounds = pages.setdefault(page, {}).setdefault(key, [])
              if bounds and bounds[-1][0] == line:
                  b = bounds[-1]
                  bounds[-1] = [line, min(b[1], minx), min(b[2], miny), max(b[3], maxx), max(b[4], maxy)]
              else:
                  bounds.append([line, minx, miny, maxx, maxy])
          for page, ayahs in pages.items():
              data = {k: [[b[1], b[2], b[3], b[4]] for b in v] for k, v in ayahs.items()}
              with open(os.path.join(out, '%03d.json' % page), 'w') as f:
                  json.dump(data, f, separators=(',', ':'))
          print('bounds pages', len(pages))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
