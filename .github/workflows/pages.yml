name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore index.html if corrupted
        run: |
          if [ ! -s index.html ] || [ "$(wc -c < index.html)" -lt 10000 ]; then
            echo "index.html looks broken ($(wc -c < index.html) bytes) — restoring from last good commit"
            curl -fsSL -o index.html "https://raw.githubusercontent.com/abdurahmanemran001-commits/qurani-bapez/2434124b18c3d94b10146a9c9956723fb1adb06b/index.html"
          fi
          # Ensure zikr-enhance is loaded from index
          if ! grep -q 'zikr-enhance.js' index.html; then
            sed -i 's|<script src="language-ui.js[^"]*"></script>|<script src="language-ui.js?v=3"></script>\n<script src="zikr-enhance.js?v=3"></script>|' index.html
          fi
          wc -c index.html
          head -c 80 index.html; echo

      - name: Prepare web preview
        run: |
          mkdir -p dist
          cp index.html language.js language-ui.js madani-ayah.js zikr-enhance.js icon.svg manifest.webmanifest sw.js dist/
          # ship any prebuilt timing JSON already in repo
          if [ -d madani-timing ]; then cp -r madani-timing dist/; fi
          bash tools/assemble_web.sh dist

      - name: Build Madinah ayah bounds (same as APK ayahinfo_1260)
        run: |
          set -e
          mkdir -p dist/madani-bounds /tmp/ai
          curl -fsSL -o /tmp/ai/ayahinfo_1260.zip \
            "https://android.quran.com/data/databases/ayahinfo/ayahinfo_1260.zip"
          unzip -o /tmp/ai/ayahinfo_1260.zip -d /tmp/ai
          python3 - <<'PY'
          import sqlite3, json, os
          conn = sqlite3.connect('/tmp/ai/ayahinfo_1260.db')
          out = 'dist/madani-bounds'
          os.makedirs(out, exist_ok=True)
          cur = conn.execute(
              'SELECT page_number,line_number,sura_number,ayah_number,min_x,max_x,min_y,max_y '
              'FROM glyphs ORDER BY page_number,sura_number,ayah_number,line_number,min_x')
          pages = {}
          for page, line, sura, ayah, minx, maxx, miny, maxy in cur:
              key = '%d:%d' % (sura, ayah)
              bounds = pages.setdefault(page, {}).setdefault(key, [])
              if bounds and bounds[-1][0] == line:
                  b = bounds[-1]
                  bounds[-1] = [line, min(b[1], minx), min(b[2], miny), max(b[3], maxx), max(b[4], maxy)]
              else:
                  bounds.append([line, minx, miny, maxx, maxy])
          for page, ayahs in pages.items():
              data = {k: [[b[1], b[2], b[3], b[4]] for b in v] for k, v in ayahs.items()}
              with open(os.path.join(out, '%03d.json' % page), 'w') as f:
                  json.dump(data, f, separators=(',', ':'))
          print('bounds pages', len(pages))
          PY
          test -s dist/madani-bounds/001.json
          test -s dist/madani-bounds/604.json

      - name: Build gapless timing JSON (try multiple .db names like APK)
        run: |
          set -e
          mkdir -p dist/madani-timing /tmp/tmdb
          python3 - <<'PY'
          import json, os, sqlite3, urllib.request
          recs = json.load(open('web/mushaf/reciters.json'))
          out = 'dist/madani-timing'
          os.makedirs(out, exist_ok=True)
          ALT = {
            'g_hamza': ['hamza_barznji_mutasil.db', 'hamza.db'],
            'g_dlshad': ['dlshad_kurdi_mutasil.db', 'dlshad.db'],
            'g_sherzad': ['sherzad_kurdi_mutasil.db', 'sherzad.db'],
            'g_shekh_reza': ['shekh_reza_mohammadian.db', 'shekh_reza.db'],
            'g_Raad': ['raad_al_kurdi.db', 'Raad.db'],
            'g_farman': ['farman_shwani_mutasil.db', 'farman.db'],
            'g_maher_al_muaiqly': ['maher_al_muaiqly.db'],
            'g_peshawa_kurdi_mutasil': ['peshawa_kurdi_mutasil.db'],
            'g_rzgar_kurdi_mutasil': ['rzgar_kurdi_mutasil.db'],
            'g_ubeda_kurdi_mutasil': ['ubeda_kurdi_mutasil.db'],
            'g_abdulhadi_kurdi_mutasil': ['abdulhadi_kurdi_mutasil.db'],
            'g_ghamdi_handren_kurdi': ['ghamdi_handren_kurdi.db'],
          }
          ok = fail = 0
          for r in recs:
              if r.get('t') != 'g' or not r.get('u'):
                  continue
              rid = r['id']
              dest = os.path.join(out, rid + '.json')
              if os.path.isfile(dest) and os.path.getsize(dest) > 100:
                  print('KEEP', rid)
                  ok += 1
                  continue
              base = r['u'].rstrip('/') + '/'
              tag = base.rstrip('/').split('/')[-1]
              candidates = ALT.get(rid, []) + [tag + '.db', rid.replace('g_', '') + '.db']
              seen = set(); names = []
              for n in candidates:
                  if n not in seen:
                      seen.add(n); names.append(n)
              path = None
              for name in names:
                  db_url = base + name
                  try:
                      urllib.request.urlretrieve(db_url, '/tmp/tmdb/' + name)
                      path = '/tmp/tmdb/' + name
                      print('DL', rid, name)
                      break
                  except Exception:
                      continue
              if not path:
                  print('FAIL download', rid)
                  fail += 1
                  continue
              try:
                  conn = sqlite3.connect(path)
                  data = {}
                  for row in conn.execute('SELECT sura,ayah,time FROM timings'):
                      try:
                          sura, ayah, time = int(row[0]), int(row[1]), int(float(row[2]))
                      except Exception:
                          continue
                      data.setdefault(str(sura), {})[str(ayah)] = time
                  if not data:
                      raise RuntimeError('empty timings')
                  with open(dest, 'w') as f:
                      json.dump(data, f, separators=(',', ':'))
                  ok += 1
                  print('OK', rid, 'suras', len(data), 'ayahs', sum(len(v) for v in data.values()))
              except Exception as e:
                  print('FAIL parse', rid, e)
                  fail += 1
          print('timing ok', ok, 'fail', fail)
          PY
          echo "timing files: $(ls dist/madani-timing | wc -l)"

      - name: Verify web data
        run: |
          D=dist/mushaf/data; miss=0
          for f in warshimg/pages/001.webp warshimg/ayah/001.json shubaimg/pages/604.webp shubaimg/ayah/604.json shubatiming/timing.json qaloonimg/pages/001.webp qaloonimg/ayah/001.json qaloontiming/t208.json qunbul/meta.json qunbul/all.json qunbul/qunbul.otf bazzi/meta.json bazzi/all.json bazzi/bazzi.otf douri/meta.json douri/all.json douri/douri.ttf susi/meta.json susi/all.json susi/susi.ttf khalaf/ayah/001.json khalaf/ayah/604.json qcf4/qcf.js tajweed/noorehira.ttf; do
            [ -s "$D/$f" ] || { echo "MISSING $f"; miss=1; }
          done
          [ $miss = 0 ] || exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
