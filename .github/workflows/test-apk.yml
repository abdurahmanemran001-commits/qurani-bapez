name: Test APK on emulator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Get APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download app-main -p '*.apk' -O /tmp/app.apk
          ls -l /tmp/app.apk
          pip install websockets -q
      - name: Run emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/emulator_test.sh
      - name: Push results
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/res && cp -r /tmp/emu/* /tmp/res/ 2>/dev/null || echo none > /tmp/res/none.txt
          git checkout --orphan data/apktest; git rm -rf . -q
          cp -r /tmp/res/. .; git add -A; git commit -q -m result; git push -f origin data/apktest
