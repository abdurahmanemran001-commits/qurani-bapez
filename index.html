<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Holy Quran</title>
<meta name="theme-color" content="#176b4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--green:#176b4b;--green2:#e8f3ee;--gold:#b48a3c;--bg:#eef2f1;--card:#fff;--ink:#18231f;--muted:#6d7975;--line:#dce5e1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:18px}.top{text-align:center;margin-bottom:15px}.top h1{margin:0 0 5px;font-size:25px}.top p{margin:0;color:var(--muted);font-size:13px}
.phone{width:min(430px,100%);height:min(860px,calc(100vh - 90px));min-height:680px;margin:auto;background:#f9fbfa;border:8px solid #202624;border-radius:30px;overflow:hidden;box-shadow:0 18px 50px #0002;position:relative}
.status{height:25px;background:#202624;color:#fff;font-size:10px;padding:6px 12px;direction:ltr}
.appbar{height:58px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:3}.appbar b{font-size:17px}.icon{border:0;background:transparent;color:#fff;font-size:23px;cursor:pointer;padding:4px}
.main{height:calc(100% - 129px);overflow:auto;padding:14px}.view{display:none}.view.active{display:block}
.welcome{text-align:center;padding:26px 8px 18px}.welcome-mark{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(145deg,#176b4b,#2e8b68);color:#fff;display:grid;place-items:center;font-size:42px;box-shadow:0 8px 20px #176b4b30}.welcome h2{font-size:22px;margin:0 0 9px;color:#174f3b}.welcome p{margin:0;color:var(--muted);font-size:13px;line-height:1.9}
.section-choices{display:grid;gap:13px;margin-top:16px}.section-choice{width:100%;display:flex;align-items:center;gap:13px;text-align:start;padding:19px 15px;border:1px solid var(--line);border-radius:19px;background:#fff;cursor:pointer;box-shadow:0 5px 15px #12251c08;transition:transform .15s,box-shadow .15s}.section-choice:active{transform:scale(.985)}.quran-choice{border-color:#b9d9cb;background:linear-gradient(135deg,#fff,#edf7f1)}.zikr-choice{border-color:#e4d5ad;background:linear-gradient(135deg,#fff,#fbf5e7)}.choice-icon{width:53px;height:53px;flex:0 0 53px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:#e0f0e7;color:var(--green)}.zikr-choice .choice-icon{background:#f4e8c9;color:#8a6828}.choice-copy{flex:1}.choice-copy b{display:block;font-size:18px;margin-bottom:6px;color:#20372d}.choice-copy small{display:block;color:var(--muted);font-size:12px;line-height:1.7}.choice-arrow{font-size:26px;color:#71857a}.welcome-note{margin-top:19px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8;padding:0 12px}
.lang-list{display:grid;gap:9px;margin-top:14px}.lang-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px;cursor:pointer;text-align:start}.lang-btn.on{border-color:#a8cbbd;background:var(--green2);font-weight:bold;color:var(--green)}
.bottom.hidden{display:none}
.hero{background:linear-gradient(135deg,#f4fbf7,#e7f3ed);border:1px solid #cfe1d9;border-radius:18px;padding:17px;text-align:center}.hero h2{margin:0 0 6px;font-size:21px}.hero p{margin:0;color:#566660;font-size:13px}
.search{display:flex;gap:7px;margin:12px 0}.search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;outline:none}.search button,.primary{background:var(--green);color:#fff;border:0;border-radius:12px;padding:10px 13px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;cursor:pointer}.tab.on{background:var(--green2);border-color:#b8d6c9;color:var(--green);font-weight:bold}
.list{display:grid;gap:8px}.surah{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;cursor:pointer}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green2);color:var(--green);font-weight:bold;font-size:12px}.surah .name{flex:1}.surah b{display:block}.surah small{color:var(--muted)}.arrow{color:#94a09b}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:13px}
.bottom{height:71px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);position:absolute;bottom:0;left:0;right:0;z-index:4}.nav{border:0;background:#fff;color:#73807b;font-size:11px;cursor:pointer}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav i{font-style:normal}.nav.on{color:var(--green);font-weight:bold}
.mushaf{background:#eeeae0;border-radius:10px;padding:7px;min-height:530px;display:flex;align-items:center;justify-content:center;overflow:hidden}.mushaf img{width:100%;height:auto;display:block;max-height:610px;object-fit:contain;background:#fff;box-shadow:0 4px 16px #0002}.mushaf-fallback{padding:30px;text-align:center;color:#6c716e}.readerbar{display:grid;grid-template-columns:45px 1fr 45px;gap:7px;align-items:center;margin-top:9px}.readerbar button{border:0;background:#fff;border:1px solid var(--line);border-radius:11px;height:42px;cursor:pointer}.readerbar input{width:100%;border:1px solid var(--line);border-radius:11px;height:42px;text-align:center}.readerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.readerhead button{border:0;background:var(--green2);color:var(--green);border-radius:10px;padding:8px 10px;cursor:pointer}
.settings .option{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff;cursor:pointer}.settings .option.on{border-color:#a8cbbd;background:var(--green2)}
.modal{position:absolute;inset:0;background:#0007;z-index:20;display:none;padding:14px;overflow:auto}.modal.open{display:block}.sheet{background:#f9fbfa;border-radius:20px;padding:16px;max-width:390px;margin:18px auto}.sheet h3{margin:0 0 12px}.close{float:left;border:0;background:#e8eeeb;border-radius:9px;padding:6px 9px;cursor:pointer}
.zikr-item{padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer}.zall{width:100%;padding:12px;margin:0 0 10px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:bold;cursor:pointer}.zon{outline:3px solid #b48a3c;background:#fffaf0}.zikr-text{font-family:serif;font-size:20px;line-height:2;text-align:right;direction:rtl}.zikr-tr{font-size:16px;line-height:1.9;margin:6px 0 8px;color:#2c3f37}.zikr-ref{font-size:12px;line-height:1.7;margin-top:6px}.counter{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:12px}.counter button{width:52px;height:52px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:20px;cursor:pointer}.counter .zplay{width:auto;height:auto;border-radius:22px;padding:12px 16px;font-size:14px}.badge{display:inline-block;background:var(--green2);color:var(--green);border-radius:20px;padding:5px 9px;font-size:11px}
.commit{font-family:monospace;font-size:11px;direction:ltr;text-align:left;word-break:break-all;background:#f3f6f5;padding:9px;border-radius:9px}
#installBtn{display:none;margin-top:10px}
@media(max-width:500px){.wrap{padding:0}.top{display:none}.status{display:none}.phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.appbar{padding-top:env(safe-area-inset-top);height:calc(58px + env(safe-area-inset-top))}.main{height:calc(100% - 129px)}.bottom{padding-bottom:env(safe-area-inset-bottom);height:calc(71px + env(safe-area-inset-bottom))}}
@media(display-mode:standalone) and (min-width:501px){.wrap{padding:0}.top{display:none}.phone{height:100vh;margin:0 auto}}

/* Dedicated adhkar appearance controls */
:root{--dhikr-ar-size:24px;--dhikr-tr-size:17px;--dhikr-ink:#20372d;--dhikr-paper:#f7f3e8}
#zikr.active,#detail.active{border-radius:16px;padding:10px;background-color:var(--dhikr-paper);background-size:cover;background-position:center;min-height:100%}
/* Let the selected Islamic background remain visible behind the adhkar text. */
#zikr.active .zikr-item,#detail.active .card{background:rgba(255,255,255,.76);color:#18231f;border-color:rgba(255,255,255,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 3px 12px rgba(0,0,0,.09)}
#zikr.active .zikr-item .muted,#detail.active .card .muted{color:#485650}
#zikr.active .zikr-item:active{background:rgba(255,255,255,.88)}
#zikr.dhikr-dark-bg .zikr-item,#detail.dhikr-dark-bg .card{background:rgba(10,19,38,.78);color:#fff;border-color:rgba(255,255,255,.25)}
#zikr.dhikr-dark-bg .muted,#detail.dhikr-dark-bg .muted{color:#e5eaf5}
#detail.dhikr-dark-bg .zikr-text,#detail.dhikr-dark-bg .zikr-tr{color:#fff}
#detail.dhikr-dark-bg .badge{background:#263b57;color:#fff}
#detail .zikr-text{font-size:var(--dhikr-ar-size);color:var(--dhikr-ink)}
#detail .zikr-tr{font-size:var(--dhikr-tr-size);color:var(--dhikr-ink)}
.dhikr-toolbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;padding:3px 2px}.dhikr-toolbar-mark{font-size:23px;color:#b08b45}.dhikr-settings-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #d7dce2;border-radius:50%;background:linear-gradient(145deg,#fff,#e9edf1);color:#364452;font-size:22px;box-shadow:0 2px 7px #14202b18;cursor:pointer}.dhikr-settings-icon:active{transform:scale(.94)}
.dhikr-controls label{display:block;font-weight:bold;margin:14px 0 7px}
.dhikr-controls input[type=range]{width:100%;accent-color:#176b4b}
.dhikr-controls select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}
.dhikr-bg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:8px}
.dhikr-bg{min-height:78px;border:2px solid transparent;border-radius:13px;padding:8px;color:white;font-size:26px;font-weight:bold;text-shadow:0 1px 3px #0009;cursor:pointer;display:flex;align-items:end;justify-content:center;text-align:center}
.dhikr-bg.selected{border-color:#b48a3c;box-shadow:0 0 0 2px #fff inset}
.dhikr-bg[data-bg=emerald]{background:radial-gradient(circle at 50% 10%,#4a9a77,#073c2b 70%);background-image:repeating-linear-gradient(45deg,#ffffff0b 0 2px,transparent 2px 13px),radial-gradient(circle at 50% 10%,#4a9a77,#073c2b 70%)}
.dhikr-bg[data-bg=mosque]{background:linear-gradient(180deg,#111d48,#394f78 58%,#d0a65c);position:relative}
.dhikr-bg[data-bg=mosque]::before{content:'☾  ۞  ☽';position:absolute;top:7px;font-size:20px;color:#f8df9b}
.dhikr-bg[data-bg=parchment]{background:repeating-linear-gradient(0deg,#f6edcf,#f6edcf 8px,#eee0b9 9px);color:#5d4825;text-shadow:none}
.dhikr-bg[data-bg=midnight]{background:radial-gradient(circle at top,#243b6b,#090f24 78%)}
.dhikr-bg[data-bg=rose]{background:radial-gradient(circle at 15% 10%,#d7b2a5,#73515d 75%)}
.dhikr-bg[data-bg=sky]{background:linear-gradient(150deg,#d7eee9,#8ebbb1 50%,#3d7168);color:#163d37;text-shadow:none}
.dhikr-bg[data-bg=geometric]{background:repeating-linear-gradient(45deg,#174c43 0 12px,#22695a 12px 24px);outline:1px solid #c8a75b}
.dhikr-bg[data-bg=sand]{background:linear-gradient(140deg,#f4dfb0,#b78a50);color:#50361a;text-shadow:none}
.dhikr-bg[data-bg=lantern]{background:radial-gradient(ellipse at 50% 110%,#a95b23,#271c3f 72%);position:relative;overflow:hidden;animation:lanternGlow 5s ease-in-out infinite alternate}
.dhikr-bg[data-bg=lantern]::before{content:'☾  🏮  ✦  🏮  ☪';position:absolute;inset:8px 0 auto;text-align:center;font-size:20px;animation:lanternFloat 3s ease-in-out infinite alternate}
.dhikr-bg[data-bg=stars]{background:radial-gradient(circle at 18% 22%,#fff 0 1px,transparent 2px),radial-gradient(circle at 76% 38%,#f8df9b 0 1px,transparent 2px),radial-gradient(circle at 40% 65%,#fff 0 1px,transparent 2px),linear-gradient(145deg,#101c43,#253b68 55%,#10152d);background-size:65px 55px,85px 70px,55px 60px,cover;animation:starDrift 12s linear infinite}
.dhikr-bg[data-bg=dawn]{background:linear-gradient(180deg,#1d3155,#b07b77 50%,#f0c985);position:relative;overflow:hidden}
.dhikr-bg[data-bg=dawn]::before{content:'☾   ۞   ☽';position:absolute;top:8px;left:0;right:0;text-align:center;font-size:24px;color:#ffe6a5;text-shadow:0 0 12px #fff2b0;animation:lanternFloat 4s ease-in-out infinite alternate}
.dhikr-bg[data-bg=ocean]{background:linear-gradient(130deg,#0d3442,#19716c,#0d3442);background-size:220% 220%;animation:oceanFlow 7s ease-in-out infinite}
@keyframes lanternGlow{from{filter:brightness(.88)}to{filter:brightness(1.2)}}
@keyframes lanternFloat{from{transform:translateY(0)}to{transform:translateY(5px)}}
@keyframes starDrift{from{background-position:0 0,0 0,0 0,center}to{background-position:65px 55px,-85px 70px,55px -60px,center}}
@keyframes oceanFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media(prefers-reduced-motion:reduce){.dhikr-bg[data-bg=lantern],.dhikr-bg[data-bg=stars],.dhikr-bg[data-bg=dawn],.dhikr-bg[data-bg=ocean]{animation:none}}
#detail.active{background-image:var(--dhikr-background,linear-gradient(135deg,#f7f3e8,#e5eadf))}
#zikr.dhikr-light-text .zikr-item,#detail.dhikr-light-text .card{background:rgba(12,20,38,.86);color:#fff;border-color:#59647a}
#zikr.dhikr-light-text .muted,#detail.dhikr-light-text .muted{color:#e1e6f0}
#detail.dhikr-light-text .badge{background:#263b57;color:#fff}
#zikr.active{background-image:var(--dhikr-background,linear-gradient(135deg,#f7f3e8,#e5eadf))}

</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1 data-i="title"></h1><p data-i="appSub"></p></div>
<div class="phone">
<div class="status">9:41 &nbsp; 4G</div>
<div class="appbar"><button class="icon" onclick="openSettings()" aria-label="Settings">☰</button><b id="barTitle" data-i="title"></b><button class="icon" onclick="showSearch()" aria-label="Search">⌕</button></div>
<div class="main">
<section id="langScreen" class="view">
<div class="welcome"><div class="welcome-mark">🌍</div><h2>Choose your language · زمانەکەت هەڵبژێرە</h2><p data-i="langNote"></p></div>
<div id="langList" class="lang-list"></div>
</section>

<section id="startScreen" class="view active">
<div class="welcome"><div class="welcome-mark">۞</div><h2 data-i="welcome"></h2><p data-i="pick"></p></div>
<div class="section-choices">
<button class="section-choice quran-choice" onclick="enterQuran()"><span class="choice-icon">📖</span><span class="choice-copy"><b data-i="quran"></b><small data-i="quranDesc"></small></span><span class="choice-arrow"></span></button>
<button class="section-choice zikr-choice" onclick="enterDhikr()"><span class="choice-icon">☀</span><span class="choice-copy"><b data-i="zikr"></b><small data-i="zikrDesc"></small></span><span class="choice-arrow"></span></button>
</div>
<div class="welcome-note" data-i="note"></div>
</section>

<section id="home" class="view">
<div class="hero"><h2 data-i="quran"></h2><p data-i="intro"></p><button id="installBtn" class="primary" onclick="installApp()" data-i="install"></button></div>
<div class="search"><input id="surahSearch" data-ph="search" oninput="filterSurahs()"><button onclick="openPage(1)" data-i="mushaf"></button><button onclick="location.href='mushaf/'" style="background:#ffd54f;color:#173f35" data-i="colored"></button></div>
<div class="tabs"><button id="tabSurah" class="tab on" onclick="setHomeTab('surah')" data-i="surahs"></button><button id="tabJuz" class="tab" onclick="setHomeTab('juz')" data-i="juz"></button><button id="tabBookmark" class="tab" onclick="setHomeTab('bookmark')" data-i="marks"></button></div>
<div id="surahList" class="list"><div class="card muted" data-i="loadingSurahs"></div></div>
<div class="card"><div class="row"><b>Project status</b><span id="version" class="badge">...</span></div><div id="commit" class="muted" style="margin-top:8px">...</div></div>
</section>

<section id="reader" class="view">
<div class="readerhead"><button onclick="goHome()" data-i="list"></button><b id="pageTitle"></b><button onclick="location.href='mushaf/?p='+currentPage" style="background:#ffd54f;color:#173f35;border:0;border-radius:10px;padding:6px 10px" data-i="colored"></button><span class="badge">604</span></div>
<div class="mushaf" id="mushaf"><img id="pageImg" alt="Mushaf" onerror="imageFailed()"></div>
<div class="readerbar"><button id="prevBtn" onclick="changePage(-1)">›</button><input id="pageInput" type="number" min="1" max="604" value="1" onchange="openPage(this.value)"><button id="nextBtn" onclick="changePage(1)">‹</button></div>
<div class="card"><div class="row"><b data-i="mushafPage"></b><span id="pageStatus" class="muted"></span></div><div class="muted" style="margin-top:7px" data-i="offline"></div></div>
</section>

<section id="zikr" class="view">
<div class="row"><div><h2 id="zikrTitle" style="margin:0"></h2><span id="zikrSub" class="muted"></span></div><button id="zikrBack" class="tab"></button></div><div class="dhikr-toolbar"><span class="dhikr-toolbar-mark">۞</span><button class="dhikr-settings-icon" aria-label="Appearance settings" title="⚙" onclick="openDhikrSettings()">⚙</button></div>
<div id="zikrList" class="list" style="margin-top:12px"><div class="card muted" data-i="loadingZikr"></div></div>
</section>

<section id="detail" class="view">
<div class="dhikr-toolbar"><span class="dhikr-toolbar-mark">۞</span><button class="dhikr-settings-icon" aria-label="Appearance settings" title="⚙" onclick="openDhikrSettings()">⚙</button></div>
<div class="row"><button class="tab" onclick="backToChapters()" data-i="backChapters"></button><button class="tab" onclick="goSections()" data-i="home"></button></div>
<div class="row" style="margin-top:10px"><h2 id="detailTitle" style="margin:0"></h2><span id="zikrCount" class="badge"></span></div>
<div id="detailList" class="list" style="margin-top:10px"></div>
</section>
</div>
<div class="bottom">
<button id="navHome" class="nav on" onclick="goSections()"><span>⌂</span><i data-i="navHome"></i></button>
<button id="navReader" class="nav" onclick="openPage(currentPage)"><span>📖</span><i data-i="navQuran"></i></button>
<button id="navSettings" class="nav" onclick="openSettings()"><span>⚙</span><i data-i="navSettings"></i></button>
</div>

<div id="dhikrSettingsModal" class="modal"><div class="sheet dhikr-controls"><button class="close" onclick="closeDhikrSettings()">×</button><h3>⚙</h3><p class="muted" data-i="dhikrNote"></p>
<label for="dhikrArabicSize"><span data-i="arSize"></span>: <span id="dhikrArabicSizeLabel">24</span>px</label><input id="dhikrArabicSize" type="range" min="18" max="40" value="24" oninput="updateDhikrSettings()">
<label for="dhikrTranslationSize"><span data-i="trSize"></span>: <span id="dhikrTranslationSizeLabel">17</span>px</label><input id="dhikrTranslationSize" type="range" min="12" max="28" value="17" oninput="updateDhikrSettings()">
<label for="dhikrTextColor" data-i="color"></label><select id="dhikrTextColor" onchange="updateDhikrSettings()"><option value="#20372d">🟩</option><option value="#171717">⬛</option><option value="#173d70">🟦</option><option value="#6b321e">🟫</option><option value="#7a2346">🟥</option><option value="#ffffff">⬜</option></select>
<label data-i="bgTitle"></label>
<div class="dhikr-bg-grid">
<button class="dhikr-bg" data-bg="emerald" aria-label="emerald" onclick="chooseDhikrBg('emerald')">🕌</button>
<button class="dhikr-bg" data-bg="mosque" aria-label="mosque" onclick="chooseDhikrBg('mosque')">🌙</button>
<button class="dhikr-bg" data-bg="parchment" aria-label="parchment" onclick="chooseDhikrBg('parchment')">📜</button>
<button class="dhikr-bg" data-bg="midnight" aria-label="midnight" onclick="chooseDhikrBg('midnight')">🌌</button>
<button class="dhikr-bg" data-bg="rose" aria-label="rose" onclick="chooseDhikrBg('rose')">🌸</button>
<button class="dhikr-bg" data-bg="sky" aria-label="sky" onclick="chooseDhikrBg('sky')">☁️</button>
<button class="dhikr-bg" data-bg="geometric" aria-label="geometric" onclick="chooseDhikrBg('geometric')">🔷</button>
<button class="dhikr-bg" data-bg="sand" aria-label="sand" onclick="chooseDhikrBg('sand')">🏜️</button>

let azkar={},zcat=-1,zchap=-1;
function isKu(){return !LANG||LANG==='ckb'||LANG==='bad'}

function azkarFile(){return isKu()?'azkar.json':'azkar.'+LANG+'.json'}
function pick(o,k){if(!o)return '';if(o[k]&&String(o[k]).trim())return o[k];return o.ckb||o.ar||''}

async function ensureAzkar(){
  const f=azkarFile();
  if(azkar[f])return azkar[f];
  try{const r=await fetch(f);if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length){azkar[f]=j;return j}}}catch{}
  return fallbackAzkar();
}

  const vidHtml=vid?'<button class="zall" data-l="'+esc(t('videoBtn'))+'" style="background:#b48a3c" onclick="zvideo(this,\''+vid+'\')">'+esc(t('videoBtn'))+'</button><div style="margin:0 0 10px"></div>':'';
  const allHtml='<button class="zall" data-l="'+esc(t('playAll'))+'" onclick="zall(this,'+i+','+j+')">'+esc(t('playAll'))+'</button>';
  $('detailList').innerHTML=zaHtml+vidHtml+allHtml+h.items.map((it,n)=>{
    const has=!!(it[k]&&String(it[k]).trim());
    let trText=has?it[k]:'',note='';
    if(!has){if(LANG==='bad'&&it.ckb){trText=it.ckb;note=t('noBad')}else note=t('noTr')}
    const trHtml=(trText||note)?'<p class="zikr-tr">'+(note?'<span class="badge" style="background:#fff3d6;color:#7a5a12;margin-bottom:6px">'+esc(note)+'</span><br>':'')+esc(trText)+'</p>':'';
    const target=Math.max(1,Number(it.repeat)||1);
    return '<div class="card" id="zc'+n+'"><b>'+esc(t('dhikrN',{n:n+1}))+(it.title?' · '+esc(it.title):'')+'</b><div class="zikr-text">'+esc(it.ar)+'</div>'+trHtml+'<div class="badge" style="margin-top:7px">'+esc(t('repeat',{n:nf(target)}))+'</div>'+(it.ref?'<div class="muted zikr-ref">'+esc(it.ref)+'</div>':'')+'<div class="counter"><button data-target="'+target+'" data-current="0" onclick="tick(this)">'+nf(0)+' / '+nf(target)+'</button> <button class="zplay" data-i="'+n+'" onclick="zplay(this,'+i+','+j+')">'+esc(t('listen'))+'</button></div></div>';
  }).join('');
}
let zAudio=null,zBtn=null,zSeq=0;
function zstop(){zSeq++;if(zAudio){try{zAudio.pause()}catch{}zAudio=null}try{speechSynthesis.cancel()}catch{}document.querySelectorAll('.zon').forEach(x=>x.classList.remove('zon'));if(zBtn){zBtn.textContent=zBtn.dataset.l||t('listen');zBtn=null}}
async function zplay(b,i,j){
  if(zBtn===b){zstop();return}
  zstop();
  const data=await ensureAzkar();const it=data[i].chapters[j].items[Number(b.dataset.i)];if(!it)return;
  const seq=zSeq;zBtn=b;b.dataset.l=t('listen');b.textContent=t('stop');
  const urls=it.ayah&&it.ayah.length?it.ayah:(it.audio?[it.audio]:null);
  if(urls){
    let n=0;
    const next=()=>{if(seq!==zSeq)return;if(n>=urls.length){zstop();return}
      const a=new Audio(urls[n++]);zAudio=a;a.onended=next;a.onerror=()=>{if(seq===zSeq){zstop();alert(t('netCheck'))}};a.play().catch(()=>{if(seq===zSeq)zstop()})};
    next();return;
  }
  try{
    const u=new SpeechSynthesisUtterance(it.ar.replace(/[﴿﴾*]/g,' '));u.lang='ar';
    u.onend=()=>{if(seq===zSeq)zstop()};u.onerror=()=>{if(seq===zSeq)zstop()};
    speechSynthesis.speak(u);
  }catch{zstop()}
}
function zVoice(){try{const re=new RegExp('^'+(isKu()?'(ckb|ku)':LANG),'i');return speechSynthesis.getVoices().find(v=>re.test(v.lang))||null}catch{return null}}
function zsay(text,lang,voice,seq){return new Promise(res=>{if(seq!==zSeq)return res();try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;if(voice)u.voice=voice;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}catch{res()}})}
function zurls(urls,seq){return new Promise(res=>{let n=0;const next=()=>{if(seq!==zSeq||n>=urls.length)return res();const a=new Audio(urls[n++]);zAudio=a;a.onended=next;a.onerror=()=>next();a.play().catch(()=>next())};next()})}
let zKuNote=false;
async function zall(b,i,j){
  if(zBtn===b){zstop();return}
  zstop();
  const data=await ensureAzkar();const h=data[i].chapters[j];if(!h)return;
  const seq=zSeq;zBtn=b;b.textContent=t('stop');
  const voice=LANG==='ar'?null:zVoice();
  if(LANG!=='ar'&&!voice&&!zKuNote){zKuNote=true;alert(t('noVoice'))}
  for(let n=0;n<h.items.length;n++){
    if(seq!==zSeq)return;
    const it=h.items[n];
    document.querySelectorAll('.zon').forEach(x=>x.classList.remove('zon'));
    const card=$('zc'+n);if(card){card.classList.add('zon');card.scrollIntoView({behavior:'smooth',block:'center'})}
    const urls=it.ayah&&it.ayah.length?it.ayah:(it.audio?[it.audio]:null);
    if(urls)await zurls(urls,seq);else await zsay(it.ar.replace(/[﴿﴾*]/g,' '),'ar',null,seq);
    if(seq!==zSeq)return;
    const tr=it[dataKey()]||it.ckb;
    if(voice&&tr)await zsay(tr,voice.lang,voice,seq);
  }
  if(seq===zSeq)zstop();
}

function loadDhikrSettings(){
 let s={};try{s=JSON.parse(localStorage.getItem('dhikr_appearance')||'{}')}catch{}
 $('dhikrArabicSize').value=s.arSize||24;$('dhikrTranslationSize').value=s.trSize||17;$('dhikrTextColor').value=s.color||'#20372d';
 applyDhikrSettings(s.bg||'emerald',false);updateDhikrSettings();
}
function chooseDhikrBg(bg){applyDhikrSettings(bg,true)}
function applyDhikrSettings(bg,save){
 document.querySelectorAll('.dhikr-bg').forEach(b=>b.classList.toggle('selected',b.dataset.bg===bg));
 document.documentElement.style.setProperty('--dhikr-background',DHIKR_BG[bg]||DHIKR_BG.emerald);
 const darkBgs=['emerald','mosque','midnight','geometric','lantern','stars','dawn','ocean'];
 const dark=darkBgs.includes(bg);
 document.querySelectorAll('#zikr,#detail').forEach(el=>el.classList.toggle('dhikr-dark-bg',dark));
 document.documentElement.style.setProperty('--dhikr-ink',dark?'#ffffff':'#20372d');
 if(save){let s={};try{s=JSON.parse(localStorage.getItem('dhikr_appearance')||'{}')}catch{}s.bg=bg;s.color=dark?'#ffffff':'#20372d';localStorage.setItem('dhikr_appearance',JSON.stringify(s));const picker=$('dhikrTextColor');if(picker)picker.value=s.color}
}
function updateDhikrSettings(){
 const ar=Number($('dhikrArabicSize').value)||24,tr=Number($('dhikrTranslationSize').value)||17,color=$('dhikrTextColor').value||'#20372d';
 $('dhikrArabicSizeLabel').textContent=ar;$('dhikrTranslationSizeLabel').textContent=tr;
 document.documentElement.style.setProperty('--dhikr-ar-size',ar+'px');document.documentElement.style.setProperty('--dhikr-tr-size',tr+'px');document.documentElement.style.setProperty('--dhikr-ink',color);document.querySelectorAll('#zikr,#detail').forEach(el=>el.classList.toggle('dhikr-light-text',color==='#ffffff'));
 let s={};try{s=JSON.parse(localStorage.getItem('dhikr_appearance')||'{}')}catch{}s.arSize=ar;s.trSize=tr;s.color=color;
 const selected=document.querySelector('.dhikr-bg.selected');s.bg=selected?selected.dataset.bg:(s.bg||'emerald');
 localStorage.setItem('dhikr_appearance',JSON.stringify(s));
}
