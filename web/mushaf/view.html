<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="base">
html,body{margin:0;padding:0;background:#fffdf5;color:#173f35}
*{-webkit-tap-highlight-color:transparent}
body.pg{padding:6px 6px 24px;background:#fffdf5}
.pg .line{display:flex;justify-content:space-between;align-items:center;white-space:nowrap;direction:rtl;gap:.25em;font-size:30px;line-height:1.95;padding:0 4px;overflow:hidden}
.pg .line.c{justify-content:center;gap:.35em}
.pg .line.hd{justify-content:center;font-size:24px;color:#6f5720;background:#f1e6c4;border:1px solid #b99a4b;border-radius:8px;margin:4px 0;line-height:1.7}
.pg .line.bs{justify-content:center;font-size:27px}
.pg .ayah{display:inline-block;margin:0;padding:0;border:0;border-radius:6px;background:none;cursor:pointer}
.pg .ayah.audioActive{background:rgba(183,228,208,.7)}
.pg .ayah.selected{background:rgba(255,213,79,.55)}
.pg span.end{min-width:1.1em;height:1.1em;line-height:1.1em;font-size:.55em;margin:0 .15em}
@font-face{font-family:Noorehira;src:url('data/tajweed/noorehira.ttf')}
body.pg:not(.q):not(.w){font-family:Noorehira,'Noto Naskh Arabic',serif}
tajweed.ham_wasl,tajweed.slnt,tajweed.laam_shamsiyah{color:#aaa}
tajweed.madda_normal{color:#537fff}tajweed.madda_permissible{color:#4050ff}
tajweed.madda_necessary{color:#000ebc}tajweed.madda_obligatory{color:#2144c1}
tajweed.qalaqah{color:#dd0008}tajweed.ikhafa_shafawi{color:#d500b7}
tajweed.ikhafa{color:#9400a8}tajweed.iqlab{color:#26bffd}
tajweed.idgham_shafawi{color:#58b800}
tajweed.idgham_ghunnah,tajweed.idgham_wo_ghunnah{color:#169200}
tajweed.idgham_mutajanisayn,tajweed.idgham_mutaqaribayn{color:#a1a1a1}
tajweed.ghunnah{color:#ff7e1e}
</style></head><body>
<script>
(function(){
var q=new URLSearchParams(location.search),mode=q.get('m')||'q',page=Math.max(1,Math.min(604,+q.get('p')||1));
var n=('00'+page).slice(-3),dir={q:'qcf4',w:'warsh',t:'tajweed'}[mode]||'qcf4';
function get(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.text();});}
function css(t){var s=document.createElement('style');s.textContent=t;document.head.appendChild(s);}
function js(t){var s=document.createElement('script');s.textContent=t;document.body.appendChild(s);}
window.selectAyah=function(s,a){document.querySelectorAll('.ayah.selected').forEach(function(e){e.classList.remove('selected');});
 if(s)document.querySelectorAll('.ayah[data-sura="'+s+'"][data-ayah="'+a+'"]').forEach(function(e){e.classList.add('selected');});};
document.addEventListener('click',function(ev){var t=ev.target;while(t&&!(t.classList&&t.classList.contains('ayah')))t=t.parentNode;
 if(t){selectAyah(t.dataset.sura,t.dataset.ayah);parent.postMessage({ayah:[+t.dataset.sura,+t.dataset.ayah]},'*');}});
window.hl=function(s,a,more){document.querySelectorAll('.ayah.audioActive').forEach(function(e){e.classList.remove('audioActive');});if(!s)return false;var f=false;[a].concat(more||[]).forEach(function(x){var l=document.querySelectorAll('.ayah[data-sura="'+s+'"][data-ayah="'+x+'"]');l.forEach(function(e){e.classList.add('audioActive');});if(l.length)f=true;});return f;};
var tx=0,ty=0;document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy))parent.postMessage({swipe:dx>0?1:-1},'*');},{passive:true});
if(mode==='w'||mode==='s'||mode==='k'){
 var idir={s:'shubaimg',k:'qaloonimg',w:'warshimg'}[mode];
 css("body.wi{margin:0;background:#fffdf5;display:flex;justify-content:center;overflow:hidden}#wp{position:relative;line-height:0}#wp img{width:100%;height:auto;mix-blend-mode:multiply;display:block;user-select:none;-webkit-user-drag:none}#wp .ayah{position:absolute;border-radius:6px;cursor:pointer;mix-blend-mode:multiply}#wp .ayah.audioActive{background:rgba(120,200,160,.45)}#wp .ayah.selected{background:rgba(255,213,79,.5)}");
 document.body.className='wi';
 Promise.all([fetch('data/'+idir+'/ayah/'+n+'.json').then(function(r){return r.json()}),new Promise(function(ok,no){var im=new Image();im.onload=function(){ok(im)};im.onerror=no;im.src='data/'+idir+'/pages/'+n+'.webp';})]).then(function(r){
  var im=r[1],W=im.naturalWidth,H=im.naturalHeight,wp=document.createElement('div');wp.id='wp';wp.appendChild(im);
  r[0].forEach(function(a){var d=document.createElement('div');d.className='ayah';d.dataset.sura=a[0];d.dataset.ayah=a[1];
   d.style.cssText='left:'+(a[3]/W*100)+'%;top:'+(a[4]/H*100)+'%;width:'+((a[5]-a[3])/W*100)+'%;height:'+((a[6]-a[4])/H*100)+'%';wp.appendChild(d);});
  document.body.appendChild(wp);
  function fit(){var w=Math.min(innerWidth,innerHeight*W/H);wp.style.width=w+'px';}
  fit();addEventListener('resize',fit);
  parent.postMessage({ready:true},'*');
 }).catch(function(){document.body.innerHTML='<p style="text-align:center;margin-top:40vh;font-family:sans-serif">پەڕەکە بارنەکرا</p>';});
 return;
}
if(mode==='b'||mode==='z'||mode==='d'){
 var qd={b:'qunbul',z:'bazzi',d:'douri'}[mode];
 Promise.all([fetch('data/'+qd+'/pages/'+n+'.json').then(function(r){return r.json()}),fetch('data/'+qd+'/meta.json').then(function(r){return r.json()})]).then(function(r){
  css("@font-face{font-family:QB;src:url('data/"+qd+"/"+qd+(qd==='douri'?'.ttf':'.otf')+"')}body.qb{margin:0;padding:6px 10px;background:#fffdf5;overflow:hidden;color:#1b1b1b}#qt{font-family:QB,serif;direction:rtl;text-align:justify;text-align-last:center;line-height:2.1;font-size:28px}#qt .qh{text-align:center;color:#6f5720;background:#f1e6c4;border:1px solid #b99a4b;border-radius:10px;margin:4px 0;line-height:1.7;font-size:1.05em}#qt .qbs{text-align:center;line-height:1.8}#qt .ayah{display:inline;border-radius:5px;cursor:pointer}#qt .end{display:inline-block;min-width:1.5em;height:1.5em;line-height:1.5em;text-align:center;border:1px solid #b99a4b;border-radius:50%;font-size:.6em;color:#6f5720;margin:0 .2em;font-family:serif;vertical-align:middle}");
  document.body.className='pg qb';var qt=document.createElement('div');qt.id='qt';var h='';
  r[0].forEach(function(a){
   if(a[1]===1){h+='<div class="qh">'+r[1].names[a[0]-1]+'</div>';if(a[0]!==1&&a[0]!==9)h+='<div class="qbs">'+r[1].bismillah+'</div>';}
   h+='<span class="ayah" data-sura="'+a[0]+'" data-ayah="'+a[1]+'">'+a[2]+' <span class="end">'+String(a[1]).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];})+'</span></span> ';
  });
  qt.innerHTML=h;document.body.appendChild(qt);
  function fit(){var H=innerHeight-14,lo=14,hi=44;for(var i=0;i<12;i++){var mid=(lo+hi)/2;qt.style.fontSize=mid+'px';if(qt.getBoundingClientRect().height>H)hi=mid;else lo=mid;}qt.style.fontSize=lo+'px';}
  var go=function(){fit();parent.postMessage({ready:true},'*');};
  if(document.fonts&&document.fonts.load){document.fonts.load('30px QB').then(go,go);setTimeout(fit,1500);}else go();
  addEventListener('resize',fit);
 }).catch(function(){document.body.innerHTML='<p style="text-align:center;margin-top:40vh;font-family:sans-serif">پەڕەکە بارنەکرا</p>';});
 return;
}
var jobs=[get('data/'+dir+'/pages/'+n+'.html')];
if(mode==='q')jobs.push(get('data/qcf4/qcf.css'),get('data/qcf4/qcf.js'));
if(mode==='w')jobs.push(get('data/warsh/warsh.css'),get('data/warsh/warsh.js'));
Promise.all(jobs).then(function(r){
 document.body.className='pg '+(mode==='q'?'q':mode==='w'?'w':'');
 if(mode==='q'){
  css("@font-face{font-family:PG;src:url('data/qcf4/fonts/p"+page+".woff2')}@font-face{font-family:QCF4_QBSML;src:url('data/qcf4/fonts/QCF4_QBSML.woff2')}@font-face{font-family:BSM;src:url('data/qcf4/fonts/QCF4_Hafs_01_W.woff2')}:root{--pf:PG}"+r[1]);
  document.body.style.visibility='hidden';
 }
 if(mode==='w'){
  var f=localStorage.getItem('warshFont')==='m'?'warsh':'naskh';
  css("@font-face{font-family:WARSH;src:url('data/warsh/"+f+".woff2')}"+r[1]);
  if(f==='naskh')r[0]=r[0].replace(/ے/g,'ي');
  document.body.style.visibility='hidden';
 }
 document.body.insertAdjacentHTML('afterbegin',r[0]);
 if(mode==='q'){js(r[2]);qinit();}
 else if(mode==='w'){js(r[2]);winit();}
 else{
  var fit=function(){var ls=[].slice.call(document.querySelectorAll('.line:not(.hd):not(.bs)'));var w=document.body.clientWidth-20,best=34;
   ls.forEach(function(l){if(l.classList.contains('c'))return;l.style.fontSize='34px';l.style.justifyContent='flex-start';var sw=0;[].forEach.call(l.children,function(c){sw+=c.getBoundingClientRect().width;});sw+=(l.children.length-1)*8.5;var fs=34*w/(sw+.0001);if(fs<best)best=fs;});
   ls.forEach(function(l){l.style.fontSize=Math.min(best,34)+'px';l.style.justifyContent='';});};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);else fit();
 }
 parent.postMessage({ready:true},'*');
}).catch(function(){document.body.innerHTML='<p style="text-align:center;margin-top:40vh;font-family:sans-serif">پەڕەکە بارنەکرا / تعذر تحميل الصفحة</p>';});
})();
</script></body></html>
