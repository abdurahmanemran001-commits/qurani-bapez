document.getElementById('lbl').onclick=function(e){
 var b=e.target.closest&&e.target.closest('button[data-a]');if(!b)return;var m=b.dataset.m,a=b.dataset.a;
 if(a==='use'){closeLib();setMode(m);}
 else if(a==='get'){getPack(m);}
 else if(a==='stop'){if(dl[m])dl[m].stop();}
 else if(a==='onl'){sv('onl_'+m,'1');closeLib();setMode(m);}
 else if(a==='del'){if(confirm('ئەم موسحەفە لەسەر مۆبایلەکەت بسڕدرێتەوە؟'))(QB?Promise.resolve(QB.remove(PK[m].dir)):FSP.rmdir({path:fsp(m),directory:'DATA',recursive:true})).catch(function(){}).then(function(){inst[m]=null;sv('onl_'+m,'0');if(mode===m){mode='q';fillReciters();show();}renderLib();});}
};
window.__pk=function(dir,done,total,st){var m=null;for(var k in PK)if(PK[k].dir===dir)m=k;if(!m)return;
 if(st==='progress'){dl[m]={done:done,total:total,stop:function(){QB.cancel(dir);}};}
 else if(st==='done'){delete dl[m];inst[m]='https://app.local/packs/'+dir+'/';}
 else{delete dl[m];if(st==='error')alert('داگرتن سەرکەوتوو نەبوو. ئینتەرنێتەکەت بپشکنە و دووبارە هەوڵبدەرەوە.');}
 renderLib();};
if(QB){for(var k in PK){var a=QB.active(PK[k].dir);if(a){var pr=a.split('/');dl[k]={done:+pr[0],total:+pr[1],stop:(function(d){return function(){QB.cancel(d);};})(PK[k].dir)};}}}
document.getElementById('lib').onclick=openLib;document.getElementById('lbx').onclick=closeLib;
document.getElementById('lb').onclick=function(e){if(e.target.id==='lb')closeLib();};
</script><script>if(location.hostname==='localhost'||location.hostname==='app.local'||location.protocol==='capacitor:'){var h=document.getElementById('home');if(h)h.style.display='none';}</script></body></html>
