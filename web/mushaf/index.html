  fetch(SRC).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(html){
    // ---- patches applied to the pinned shell (plain black mushaf mode, back-button fix) ----
    function rep(a, b) { if (html.indexOf(a) >= 0) html = html.split(a).join(b); else if (window.console) console.warn('mushaf patch missed:', a.slice(0, 40)); }
    rep("var BI={q:{n:window.MUSHAF_T.madina,", "var BI={p:{n:'موسحەفی ئاسایی (پەڕەش)',s:'حَفْص عن عاصم',x:'موسحەفی مەدینە بە دەقی ڕەش، بێ ڕەنگی تەجوید. لەناو ئەپەکەدایە.'},q:{n:window.MUSHAF_T.madina,");
    rep("card('q')+card('t')", "card('p')+card('q')+card('t')");
    rep("'qwtskbzdu'.indexOf(qs.get('m'))", "'pqwtskbzdu'.indexOf(qs.get('m'))");
    rep("f.src='view.html?m='+mode+'&p='+page+(bp?'&b='+encodeURIComponent(bp):'');", "var __u='view.html?m='+mode+'&p='+page+(bp?'&b='+encodeURIComponent(bp):'');try{f.contentWindow.location.replace(__u);}catch(e){f.src=__u;}");
    rep("onclick=\"location.href='../'\"", "onclick=\"__goHome()\"");
    rep('<button id="px" title="داخستن">✕</button>', '<button id="ps" title="وەستانی تەواو (دەگەڕێتەوە سەرەتای ئایەت)">⏹</button><button id="sp" title="خێرایی">1×</button><button id="px" title="داخستن">✕</button>');
    rep('<button id="pa" title="ئایەتی پێشوو">⏮</button>', '<button id="pa" title="ئایەتی پێشوو">⏮</button>');
    rep("px.onclick=function(){au.pause();bad();cur=null;frameHl();document.getElementById('pl').classList.remove('on');};", "px.onclick=function(){au.pause();bad();cur=null;frameHl();document.getElementById('pl').classList.remove('on');};document.getElementById('ps').onclick=function(){if(!cur)return;au.pause();try{au.currentTime=0;}catch(e){}bad();};var SPD=[0.75,1,1.25,1.5,2],si=SPD.indexOf(+ld('sp',1));if(si<0)si=1;function aps(){var r=SPD[si];au.defaultPlaybackRate=r;au.playbackRate=r;document.getElementById('sp').textContent=r+'×';}aps();document.getElementById('sp').onclick=function(){si=(si+1)%SPD.length;sv('sp',SPD[si]);aps();};au.addEventListener('loadedmetadata',aps);au.addEventListener('play',aps);");
    rep("<body>", "<body><script>window.__goHome=function(){try{history.back();}catch(e){}setTimeout(function(){location.replace('../');},450);};<\/script>");
    document.open();
    document.write(html);
    document.close();
    // load gapless support after shell scripts run
    setTimeout(function(){
      var s = document.createElement('script');
      s.src = 'player-gapless.js?v=4';
      document.body.appendChild(s);
      var g=document.createElement('script');
      g.src='reciter-groups.js?v=2';
      document.body.appendChild(g);
      var h=document.createElement('script');
      h.src='shell-actions.js?v=9';
      document.body.appendChild(h);
    }, 800);
  }).catch(function(e){
    var el = document.getElementById('boot');
    if(el) el.textContent = 'نەتوانرا موسحەف باربکرێت. Refresh بکە. (' + e + ')';
  });
})();
