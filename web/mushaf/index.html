<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4b">
<title>موسحەفی قورئان</title>
</head>
<body style="margin:0;font-family:Tahoma,Arial,sans-serif;background:#fffdf5">
<p id="boot" style="text-align:center;padding:40px;color:#176b4b">بارکردنی موسحەف...</p>
<script>
(function(){
  var SRC = 'https://cdn.jsdelivr.net/gh/abdurahmanemran001-commits/qurani-bapez@b6ad7d502881aaec5c6cc4799ae182e7abe7cedc/web/mushaf/index.html';
  fetch(SRC).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(html){
    document.open();
    document.write(html);
    document.close();
    // load gapless support after shell scripts run
    setTimeout(function(){
      var s = document.createElement('script');
      s.src = 'player-gapless.js';
      document.body.appendChild(s);
    }, 800);
  }).catch(function(e){
    var el = document.getElementById('boot');
    if(el) el.textContent = 'نەتوانرا موسحەف باربکرێت. Refresh بکە. (' + e + ')';
  });
})();
</script>
</body>
</html>
