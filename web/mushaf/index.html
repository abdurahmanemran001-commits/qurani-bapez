<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4b">
<title>موسحەفی قورئان</title>
<style>
:root{--g:#176b4b;--bg:#fffdf5}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;gap:6px;align-items:center;padding:6px;background:var(--g);color:#fff;flex-wrap:wrap}
header select,header input,header button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:6px 8px;background:#fff;color:#173f35;min-height:34px}
header input{width:62px;text-align:center}
header button{background:#e8f3ee;cursor:pointer}
#modes{display:flex;gap:4px;flex:1;min-width:200px}
#modes button{flex:1;font-size:13px;padding:6px 4px}
#modes button.on{background:#ffd54f;font-weight:700}
#sura{flex:1;min-width:120px}
#f{flex:1;border:0;width:100%;background:var(--bg)}
#pl{display:none;gap:6px;align-items:center;padding:6px;background:#173f35;color:#fff;flex-wrap:wrap;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#pl.on{display:flex}
#pl button,#pl select{font:inherit;border:0;border-radius:8px;padding:6px 10px;min-height:34px;background:#e8f3ee;color:#173f35}
#pl #pp{background:#ffd54f;font-weight:700;min-width:44px}
#pl #pt{flex:1;min-width:90px;font-size:13px;text-align:center}
#pl select{flex:1;min-width:130px}
#tip{position:absolute;bottom:10px;left:10px;right:10px;margin:auto;max-width:420px;background:#173f35;color:#fff;border-radius:10px;padding:8px 12px;text-align:center;font-size:14px;display:none}
</style></head><body>
<div id="app">
<header>
 <button onclick="location.href='../'" title="گەڕانەوە">⌂</button>
 <button id="next" title="دواتر">›</button>
 <input id="pg" type="number" min="1" max="604" inputmode="numeric">
 <button id="prev" title="پێشوو">‹</button>
 <select id="sura"></select>
 <div id="modes">
  <button data-m="q">مەدینە تەجوید</button>
  <button data-m="w" hidden>وەرش</button>
  <button data-m="t">تەجوید</button>
 </div>
</header>
<iframe id="f" title="mushaf"></iframe>
<div id="pl"><select id="rc"></select><button id="pa" title="ئایەتی پێشوو">⏮</button><button id="pp">▶</button><button id="pn" title="ئایەتی دواتر">⏭</button><span id="pt"></span><button id="px" title="داخستن">✕</button></div>
<div id="tip"></div>
</div>
<script>
var N=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
var pp,pa,pn,px,rc;
pp=document.getElementById('pp');pa=document.getElementById('pa');pn=document.getElementById('pn');px=document.getElementById('px');rc=document.getElementById('rc');
var S=[],mode='q',page=1,f=document.getElementById('f'),pg=document.getElementById('pg'),sel=document.getElementById('sura');
function ld(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
mode=ld('m','q');if(mode==='w')mode='q';page=+ld('p',1)||1;
var qs=new URLSearchParams(location.search);if(qs.get('p'))page=+qs.get('p')||page;if('qt'.indexOf(qs.get('m'))>=0&&qs.get('m'))mode=qs.get('m');
function suraOf(p){var s=0;for(var i=0;i<114;i++)if(S[i]<=p)s=i;return s;}
function show(){
 page=Math.max(1,Math.min(604,page));pg.value=page;sel.value=suraOf(page);
 [].forEach.call(document.querySelectorAll('#modes button'),function(b){b.classList.toggle('on',b.dataset.m===mode)});
 sv('m',mode);sv('p',page);
 f.src='view.html?m='+mode+'&p='+page;
 var a=new Image();
}
function go(d){page+=d;show();}
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('prev').onclick=function(){go(-1)};
pg.onchange=function(){page=+pg.value||1;show();};
sel.onchange=function(){page=S[+sel.value];show();};
document.getElementById('modes').onclick=function(e){var m=e.target.dataset&&e.target.dataset.m;if(m){mode=m;show();}};
addEventListener('message',function(e){var d=e.data||{};
 if(d.ready&&cur)frameHl();
 if(d.swipe)go(d.swipe);
 if(d.ayah){var wasPlaying=playing;au.pause();playing=false;pp.textContent='▶';setCur(d.ayah[0],d.ayah[1],false);}
});
addEventListener('keydown',function(e){if(e.target===pg)return;if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1);});
fetch('starts.json').then(function(r){return r.json()}).then(function(s){S=s;
 N.forEach(function(n,i){var o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+n;sel.appendChild(o);});show();});

var C=[7, 286, 200, 176, 120, 165, 206, 75, 129, 109, 123, 111, 43, 52, 99, 128, 111, 110, 98, 135, 112, 78, 118, 64, 77, 227, 93, 88, 69, 60, 34, 30, 73, 54, 45, 83, 182, 88, 75, 85, 54, 53, 89, 59, 37, 35, 38, 29, 18, 45, 60, 49, 62, 55, 78, 96, 29, 22, 24, 13, 14, 11, 11, 18, 12, 12, 30, 52, 52, 44, 28, 28, 20, 56, 40, 31, 50, 40, 46, 42, 29, 19, 36, 25, 22, 17, 19, 26, 30, 20, 15, 21, 11, 8, 8, 19, 5, 8, 8, 11, 11, 8, 3, 9, 5, 4, 7, 3, 6, 3, 5, 4, 5, 6],R=[],au=new Audio(),cur=null,playing=false;
function pad(n,l){return ('000'+n).slice(-l);}
function frameHl(){try{var ok=f.contentWindow.hl(cur&&cur[0],cur&&cur[1]);return ok;}catch(e){return false;}}
function setCur(s,a,play){
 cur=[s,a];document.getElementById('pl').classList.add('on');
 document.getElementById('pt').textContent=N[s-1]+' · '+a;
 if(!frameHl()&&play&&page<604){page++;show();}
 if(play)start();
}
function url(){return 'https://everyayah.com/data/'+rc.value+'/'+pad(cur[0],3)+pad(cur[1],3)+'.mp3';}
function start(){au.src=url();au.play().then(function(){playing=true;pp.textContent='⏸';}).catch(function(){playing=false;pp.textContent='▶';});}
function step(d){
 if(!cur)return;var s=cur[0],a=cur[1]+d;
 if(a>C[s-1]){s++;a=1;}else if(a<1){s--;if(s<1)return;a=C[s-1];}
 if(s>114)return;setCur(s,a,playing);
}
au.onended=function(){if(cur[0]===114&&cur[1]===C[113]){playing=false;pp.textContent='▶';return;}step(1);};
pp.onclick=function(){if(!cur)return;if(playing){au.pause();playing=false;pp.textContent='▶';}else{if(au.src&&au.src===url()){au.play();playing=true;pp.textContent='⏸';}else start();}};
pn.onclick=function(){step(1)};pa.onclick=function(){step(-1)};
px.onclick=function(){au.pause();playing=false;pp.textContent='▶';cur=null;frameHl();document.getElementById('pl').classList.remove('on');};
rc.onchange=function(){sv('rc',rc.value);if(cur&&playing)start();};
fetch('reciters.json').then(function(r){return r.json()}).then(function(l){R=l;l.forEach(function(r){var o=document.createElement('option');o.value=r.id;o.textContent=r.n;rc.appendChild(o);});var v=ld('rc','');if(v)rc.value=v;});
</script></body></html>
